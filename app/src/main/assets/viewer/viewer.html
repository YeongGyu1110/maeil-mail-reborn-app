<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 웹 서비스의 질문 화면(questions/index.html)과 같은 라이브러리·버전으로 그린다. lib/의 파일은 웹의 integrity 값으로 검사해 넣었다 -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/prism.min.js"></script>
  <script src="lib/prism-javascript.min.js"></script>
  <script src="lib/prism-typescript.min.js"></script>
  <!-- jsx는 javascript 뒤, tsx는 jsx와 typescript 뒤에 와야 한다 -->
  <script src="lib/prism-jsx.min.js"></script>
  <script src="lib/prism-tsx.min.js"></script>
  <script src="lib/prism-json.min.js"></script>
  <script src="lib/prism-bash.min.js"></script>
  <script src="lib/prism-graphql.min.js"></script>
  <script src="lib/prism-sql.min.js"></script>
  <script src="lib/prism-java.min.js"></script>
  <script src="lib/prism-yaml.min.js"></script>
  <script src="lib/prism-sass.min.js"></script>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="memo.css">
</head>
<body>
  <!-- 한 질문의 문서. 좌우로 밀면 손가락을 따라 옆으로 움직이고, 옆 질문(#peek-prev, #peek-next)이 함께 들어온다 (viewer.js 넘기기).
       옆 질문은 이 문서의 틀을 복사해 그리므로, 모양은 id가 아닌 class로 준다 -->
  <div id="page" class="page">
  <header class="doc-header">
    <div id="meta" class="doc-meta"></div>
    <h1 id="title" class="doc-title"></h1>
    <!-- 지금 이해도와 메모가 있는지 (웹 .doc-status). 기록한 것이 있을 때만 보이고, 누르면 학습 기록으로 내려간다 -->
    <div id="doc-status" class="doc-status" hidden>
      <a id="status-level" class="level-badge" href="#study" hidden></a>
      <a id="status-memo" class="status-memo" href="#memo" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        내 메모
      </a>
    </div>
  </header>
  <main id="content" class="doc-content"></main>
  <!-- 학습 기록 (웹 .study): 답을 읽은 뒤 이해도를 고르고, 내 메모를 본다. 로그인했을 때만 보인다.
       메모 보기·편집기는 웹과 같은 memo-ui.js가 그리고, 저장·GitHub 커밋은 앱이 한다.
       여기서는 메모를 보기만 하고, 고치는 것은 메모 창(#memo-window)에서 한다 -->
  <section id="study" class="study" aria-labelledby="study-heading" hidden>
    <div class="study-head">
      <h2 id="study-heading" class="study-title">학습 기록</h2>
    </div>
    <div class="study-block">
      <div class="study-block-head">
        <h3 id="level-heading" class="study-block-title">이해도</h3>
      </div>
      <div id="level-control" class="level-control" role="radiogroup" aria-labelledby="level-heading">
        <button type="button" class="level-option" role="radio" data-level="new" aria-checked="true"><span class="dot"></span>미학습</button>
        <button type="button" class="level-option" role="radio" data-level="review" aria-checked="false" tabindex="-1"><span class="dot dot-review"></span>복습 필요</button>
        <button type="button" class="level-option" role="radio" data-level="done" aria-checked="false" tabindex="-1"><span class="dot dot-done"></span>완벽 이해</button>
      </div>
    </div>
    <div id="memo" class="study-block">
      <div class="study-block-head">
        <h3 class="study-block-title">내 메모</h3>
        <button type="button" id="memo-edit" class="btn btn-sm btn-soft memo-edit" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          편집
        </button>
      </div>
      <div id="memo-body" class="memo-body"></div>
      <!-- 메모 저장소를 아직 고르지 않았을 때만 보인다 -->
      <p id="memo-repo" class="memo-repo" hidden>
        <span>저장소를 고르면 메모가 GitHub에도 커밋돼요</span>
        <button type="button" id="memo-repo-pick" class="link-btn">저장소 고르기</button>
      </p>
    </div>
  </section>
  </div>
  <!-- 좌우로 밀 때 함께 들어오는 옆 질문. 이전 질문은 왼쪽, 다음 질문은 오른쪽에서 온다. 보기만 하는 그림이다 -->
  <div id="peek-prev" class="peek" aria-hidden="true" inert></div>
  <div id="peek-next" class="peek" aria-hidden="true" inert></div>
  <!-- 메모 창: 메모를 고칠 때 본문 위에 겹쳐 여는 한 화면 (viewer.js가 채운다) -->
  <section id="memo-window" class="memo-window" aria-label="메모" hidden></section>
  <script src="memo-core.js"></script>
  <script src="memo-merge.js"></script>
  <script src="memo-ui.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
